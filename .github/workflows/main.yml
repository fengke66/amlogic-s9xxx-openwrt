   name: Get WARP Config
   on: workflow_dispatch # 允许手机上点击按钮手动触发
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - name: Run Warp Script
           run: |
             # 这里使用目前 2026 年主流的第三方零信任提取脚本或官方 API 模拟
             curl -fsSL https://raw.githubusercontent.com/ViGEm/WarpDrive/main/warp-team-register.sh | bash -s -- "gtfengkai"
         - name: Upload Config
           uses: actions/upload-artifact@v4
           with:
             name: warp-wg-config
             path: ./wgcf-profile.conf
